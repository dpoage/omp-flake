name: Bump Oh My Pi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Update flake.nix to latest release
        id: bump
        run: |
          set -euo pipefail

          latest_tag="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/can1357/oh-my-pi/releases/latest | jq -r '.tag_name')"
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then
            echo "Unable to determine latest release tag"
            exit 1
          fi

          latest_version="${latest_tag#v}"
          current_version="$(grep -m1 'version = "' flake.nix | sed -E 's/.*"([^"]+)".*/\1/')"

          if [ "$latest_version" = "$current_version" ]; then
            echo "Already on latest version: $current_version"
            exit 0
          fi

          declare -A assets=(
            [x86_64-linux]="omp-linux-x64"
            [aarch64-linux]="omp-linux-arm64"
            [x86_64-darwin]="omp-darwin-x64"
            [aarch64-darwin]="omp-darwin-arm64"
          )

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          sources_file="$tmp_dir/sources.tsv"
          : > "$sources_file"

          for system in x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin; do
            asset="${assets[$system]}"
            url="https://github.com/can1357/oh-my-pi/releases/download/$latest_tag/$asset"
            curl -fL "$url" -o "$tmp_dir/$asset"
            printf '%s\t%s\t%s\n' "$system" "$url" "$(nix hash file "$tmp_dir/$asset")" >> "$sources_file"
          done

          export latest_version sources_file
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          flake_path = Path("flake.nix")
          text = flake_path.read_text()

          text, count = re.subn(r'version = "[^"]+";', f'version = "{os.environ["latest_version"]}";', text, count=1)
          if count != 1:
              raise SystemExit("Failed to update version")

          for line in Path(os.environ["sources_file"]).read_text().splitlines():
              system, url, sha = line.split("\t")
              pattern = rf'("{re.escape(system)}"\s*=\s*\{{\s*url\s*=\s*")[^"]+(";\s*sha256\s*=\s*")[^"]+(";\s*\}};)'
              text, count = re.subn(pattern, rf'\g<1>{url}\g<2>{sha}\g<3>', text, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Failed to update source block for {system}")

          flake_path.write_text(text)
          PY

          echo "version=$latest_version" >> "$GITHUB_OUTPUT"

      # Builds x86_64-linux and runs the installCheck (`omp --version`), so a
      # broken release never lands on main.
      - name: Build
        if: steps.bump.outputs.version != ''
        run: nix build .#default --print-build-logs

      - name: Commit and push
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump oh-my-pi to v${{ steps.bump.outputs.version }}"
          git push
